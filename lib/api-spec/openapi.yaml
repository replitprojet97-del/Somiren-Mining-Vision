openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/tasks:
    get:
      operationId: listAdminTasks
      responses:
        "200":
          description: Tasks and their assigned collaborators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTaskList" }
    post:
      operationId: createAdminTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTaskInput" }
      responses:
        "201":
          description: Assigned task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTaskResult" }
  /admin/tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateAdminTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTaskUpdate" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTaskResult" }
    delete:
      operationId: deleteAdminTask
      responses:
        "200":
          description: Deleted task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTaskDeletion" }
  /workspace/tasks:
    get:
      operationId: listWorkspaceTasks
      responses:
        "200":
          description: Tasks assigned to the authenticated collaborator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTaskList" }
  /workspace/tasks/{id}:
    patch:
      operationId: updateWorkspaceTask
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceTaskUpdate" }
      responses:
        "200":
          description: Updated own task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTaskResult" }
  /workspace/cases/{id}:
    get:
      operationId: getWorkspaceCaseDetails
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Assigned case and authorized associated records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceCaseDetails" }
  /workspace/documents/{id}/file:
    get:
      operationId: getOwnWorkspaceDocumentFile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Short-lived signed URL for an own document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /auth/login:
    post:
      operationId: loginCollaborator
      tags: [collaborator-auth]
      summary: Sign in with a collaborator password, optionally starting a second-factor challenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollaboratorLoginInput" }
      responses:
        "200":
          description: Signed in, or a short-lived second-factor challenge cookie was set
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie:
              description: HTTP-only secure challenge cookie is set on second-factor login; otherwise a collaborator session cookie is set
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CollaboratorLoginSuccess"
                  - $ref: "#/components/schemas/CollaboratorLoginChallenge"
        "400": { description: Invalid login request }
        "401": { description: Invalid credentials }
        "429": { description: Login rate limited or account temporarily locked }
        "503": { description: Second-factor decryption is unavailable }
  /auth/2fa/verify:
    post:
      operationId: verifyCollaboratorTwoFactor
      tags: [collaborator-auth]
      summary: Complete a pending collaborator login using a TOTP or unused recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCodeInput" }
      responses:
        "200":
          description: Second factor accepted and full collaborator session created
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie:
              description: Full collaborator session cookie is set after challenge consumption
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaboratorLoginSuccess" }
        "400": { description: Invalid challenge or code }
        "401": { description: "Challenge expired, invalid, or code rejected" }
        "429": { description: Challenge attempt limit reached }
  /auth/2fa/cancel:
    post:
      operationId: cancelCollaboratorTwoFactor
      tags: [collaborator-auth]
      summary: Cancel a pending second-factor login challenge
      responses:
        "204":
          description: Challenge cookie cleared
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie: { schema: { type: string } }
  /auth/logout:
    post:
      operationId: logoutCollaborator
      tags: [collaborator-auth]
      summary: Revoke the current collaborator session and clear any pending login challenge
      responses:
        "204":
          description: Session and challenge cookies cleared
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie: { schema: { type: string } }
  /workspace/security/2fa:
    get:
      operationId: getWorkspaceTwoFactorStatus
      tags: [workspace-security]
      summary: Get second-factor enrollment status for the authenticated collaborator
      responses:
        "200":
          description: Enrollment status, without disclosing the configured secret
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
        "401": { description: Authenticated collaborator session required }
        "403": { description: Legacy ADMIN_PASSWORD portal is not eligible for collaborator second-factor management }
  /workspace/security/2fa/setup:
    post:
      operationId: setupWorkspaceTwoFactor
      tags: [workspace-security]
      summary: Begin password-verified TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorSetupInput" }
      responses:
        "200":
          description: Pending setup secret and provisioning URI (expires in ten minutes)
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "401": { description: Password invalid or collaborator session absent }
        "403": { description: Legacy ADMIN_PASSWORD portal is not eligible for collaborator second-factor management }
        "409": { description: Second factor is already enabled }
        "429": { description: Enrollment rate limit reached }
        "503":
          description: Secret encryption is unavailable because SESSION_SECRET is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorUnavailable" }
  /workspace/security/2fa/enable:
    post:
      operationId: enableWorkspaceTwoFactor
      tags: [workspace-security]
      summary: Confirm pending TOTP enrollment and receive one-time recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCodeInput" }
      responses:
        "200":
          description: Second factor enabled and recovery codes returned once
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorEnabled" }
        "400": { description: No valid pending setup or invalid code }
        "401": { description: Authenticated collaborator session required }
        "403": { description: Legacy ADMIN_PASSWORD portal is not eligible for collaborator second-factor management }
        "409": { description: Second factor is already enabled }
        "429": { description: Code verification rate limit reached }
  /workspace/security/2fa/disable:
    post:
      operationId: disableWorkspaceTwoFactor
      tags: [workspace-security]
      summary: Disable second factor after password and second-factor verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorDisableInput" }
      responses:
        "200":
          description: Second factor disabled
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorDisabled" }
        "400": { description: Invalid request or second-factor code }
        "401": { description: Password invalid or authenticated collaborator session required }
        "403": { description: Legacy ADMIN_PASSWORD portal is not eligible for collaborator second-factor management }
        "409": { description: Second factor is not enabled }
        "429": { description: Code verification rate limit reached }
  /workspace/security/2fa/recovery-codes:
    post:
      operationId: regenerateWorkspaceTwoFactorRecoveryCodes
      tags: [workspace-security]
      summary: Regenerate recovery codes after password and existing second-factor verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorDisableInput" }
      responses:
        "200":
          description: Replacement recovery codes returned once
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorRecoveryCodes" }
        "400": { description: Invalid request or second-factor code }
        "401": { description: Password invalid or authenticated collaborator session required }
        "403": { description: Legacy ADMIN_PASSWORD portal is not eligible for collaborator second-factor management }
        "409": { description: Second factor is not enabled }
        "429": { description: Code verification rate limit reached }
  /workspace/sessions:
    get:
      operationId: listWorkspaceSessions
      tags: [workspace-security]
      summary: List authenticated collaborator sessions with available browser and operating-system names
      responses:
        "200":
          description: Session list without session credentials or raw user-agent values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSessionList" }
        "401": { description: Authenticated collaborator session required }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestPrivateUploadUrl
      tags: [private-media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateUploadRequest"
      responses:
        "201":
          description: Signed private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUploadUrl"
  /storage/uploads/{assetId}/complete:
    post:
      operationId: completePrivateUpload
      tags: [private-media]
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Verified uploaded file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUpload"
  /workspace/me/photo:
    get:
      operationId: getWorkspaceProfilePhoto
      tags: [workspace-profile]
      summary: Get the signed private profile photo for the current collaborator
      responses:
        "200":
          description: Current collaborator photo and explicit removal state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceProfilePhoto" }
        "401":
          description: Authentication required
    put:
      operationId: setWorkspaceProfilePhoto
      tags: [workspace-profile]
      summary: Set the current collaborator's own profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetWorkspaceProfilePhotoInput" }
      responses:
        "200":
          description: Own profile photo was updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: boolean, const: true }
        "400":
          description: Upload is invalid, incomplete, or belongs to another collaborator
        "401":
          description: Authentication required
    delete:
      operationId: removeWorkspaceProfilePhoto
      tags: [workspace-profile]
      summary: Remove the current collaborator's own profile photo
      responses:
        "200":
          description: Own profile photo was removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: boolean, const: true }
        "401":
          description: Authentication required
  /admin/document-assignments:
    post:
      operationId: assignPrivateDocument
      tags: [private-media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAssignmentInput"
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/AssignedDocument" }
                  assignment: { $ref: "#/components/schemas/DocumentAssignment" }
    get:
      operationId: listPrivateDocumentAssignments
      tags: [private-media]
      responses:
        "200":
          description: Assignment list with attachment metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: { type: object }
  /admin/document-assignments/{id}/file:
    get:
      operationId: getAdminAssignedDocumentFile
      tags: [private-media]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Short-lived signed download URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /workspace/documents/received/{id}/file:
    get:
      operationId: getReceivedDocumentFile
      tags: [private-media]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Short-lived signed download URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /workspace/documents/received/{id}/returns:
    post:
      operationId: returnReceivedDocument
      tags: [private-media]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentReturnInput" }
      responses:
        "201":
          description: File returned and Management notified atomically; retrying the same asset is idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentReturnSuccess" }
        "400": { description: Invalid or incomplete document upload }
        "403": { description: Submission permission required }
        "404": { description: Assignment not found for the signed-in collaborator }
  /workspace/documents/returns/{id}/file:
    get:
      operationId: getReturnedDocumentFile
      tags: [private-media]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Owner-authorized short-lived download URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /admin/document-returns:
    get:
      operationId: listDocumentReturns
      tags: [private-media]
      responses:
        "200":
          description: Document return history, reserved to confidential administrators
          content:
            application/json:
              schema:
                type: object
                required: [returns]
                properties:
                  returns:
                    type: array
                    items: { $ref: "#/components/schemas/AdminDocumentReturn" }
  /admin/document-returns/{id}/file:
    get:
      operationId: getAdminReturnedDocumentFile
      tags: [private-media]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Confidential administrator short-lived download URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /admin/conversations:
    get:
      operationId: listAdminConversations
      tags: [private-messaging]
      responses:
        "200":
          description: Conversations and collaborators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConversationList" }
    post:
      operationId: createAdminConversation
      tags: [private-messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminConversationInput" }
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
  /conversations:
    get:
      operationId: listConversations
      tags: [private-messaging]
      responses:
        "200":
          description: Conversations and collaborators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConversationList" }
    post:
      operationId: createConversation
      tags: [private-messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminConversationInput" }
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
  /admin/conversations/{id}/messages:
    get:
      operationId: listAdminConversationMessages
      tags: [private-messaging]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
    post:
      operationId: sendAdminConversationMessage
      tags: [private-messaging]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
  /admin/conversations/{id}/messages/{messageId}/file:
    get:
      operationId: getAdminMessageAudioFile
      tags: [private-messaging]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: messageId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Short-lived audio download URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /workspace/conversations:
    get:
      operationId: listWorkspaceConversations
      tags: [private-messaging]
      responses:
        "200":
          description: Collaborator conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items: { type: object }
    post:
      operationId: createWorkspaceConversation
      tags: [private-messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceConversationInput" }
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
  /workspace/conversations/{id}/messages:
    get:
      operationId: listWorkspaceConversationMessages
      tags: [private-messaging]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
    post:
      operationId: sendWorkspaceConversationMessage
      tags: [private-messaging]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
  /workspace/conversations/{id}/messages/{messageId}/file:
    get:
      operationId: getWorkspaceMessageAudioFile
      tags: [private-messaging]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: messageId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Short-lived audio download URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /admin/notifications:
    get:
      operationId: listAdminNotifications
      tags: [notifications]
      responses:
        "200":
          description: Current administrator notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
  /admin/notifications/{id}/read:
    patch:
      operationId: markAdminNotificationRead
      tags: [notifications]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked notification read
          content:
            application/json:
              schema: { type: object }
  /admin/notifications/read-all:
    patch:
      operationId: markAllAdminNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: Marked all owned notifications read
          content:
            application/json:
              schema: { type: object }
  /workspace/notifications/read-all:
    patch:
      operationId: markAllWorkspaceNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: Marked all owned notifications read
          content:
            application/json:
              schema: { type: object }
  /admin/meetings:
    post:
      operationId: createMeetingWithPrivateVideo
      tags: [private-media]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingInput" }
      responses:
        "201":
          description: Created meeting and optional video metadata
          content:
            application/json:
              schema: { type: object }
  /admin/meetings/{id}/video:
    get:
      operationId: getAdminMeetingVideo
      tags: [private-media]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Signed meeting video URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /workspace/meetings/{id}/video:
    get:
      operationId: getWorkspaceMeetingVideo
      tags: [private-media]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Signed meeting video URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateFileUrl" }
  /admin/video-authorizations:
    get:
      operationId: listAdminVideoAuthorizations
      tags: [admin-video]
      responses:
        "200":
          description: Video authorization assignments and their collaborators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVideoAuthorizationList" }
        "403": { description: Confidential administrator access required }
    post:
      operationId: assignAdminVideoAuthorizations
      tags: [admin-video]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveVideoAuthorizationInput" }
      responses:
        "201":
          description: One video authorization created for each assigned collaborator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignedVideoAuthorizations" }
        "400": { description: Invalid assignment or inactive/admin participant }
        "403": { description: Confidential administrator access required }
  /admin/video-authorizations/{id}:
    delete:
      operationId: revokeAdminVideoAuthorization
      tags: [admin-video]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Authorization revoked, or already revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoAuthorizationRevocation" }
        "400": { description: Invalid authorization id }
        "403": { description: Confidential administrator access required }
        "404": { description: Authorization not found }
        "409": { description: Authorization could not be revoked }
  /workspace/video-access:
    get:
      operationId: getWorkspaceVideoAccess
      tags: [workspace-video]
      responses:
        "200":
          description: Current collaborator's active video authorizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceVideoAccess" }
        "401": { description: Authentication required }
  /workspace/video/join:
    post:
      operationId: joinWorkspaceVideoMeeting
      tags: [workspace-video]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceVideoJoinInput" }
      responses:
        "200":
          description: Authorized meeting URL and expiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceVideoJoinResult" }
        "400": { description: Invalid authorization id }
        "401": { description: Authentication required }
        "403": { description: Video permission or active assignment required }
  /workspace/messages/unread-count:
    get:
      operationId: getWorkspaceUnreadMessageCount
      tags: [workspace-messages]
      responses:
        "200":
          description: Number of incoming unread messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadMessageCount" }
        "401": { description: Authentication required }
        "403": { description: Internal messaging permission required }
  /workspace/conversations/{id}/read:
    patch:
      operationId: markWorkspaceConversationRead
      tags: [workspace-messages]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationReadInput" }
      responses:
        "200":
          description: Conversation read cursor advanced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationReadResult" }
        "400": { description: Invalid conversation id or cursor message }
        "401": { description: Authentication required }
        "403": { description: Internal messaging permission required }
        "404": { description: Conversation not found }
  /admin/collaborators/{collaboratorId}/arrears:
    get:
      operationId: listCollaboratorArrears
      tags: [admin-finance]
      parameters:
        - in: path
          name: collaboratorId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Confidential arrears and transfer-request records for a collaborator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrearsList" }
        "400": { description: Invalid collaborator id }
        "403": { description: Confidential finance data requires the ADMIN role }
        "404": { description: Collaborator not found }
    post:
      operationId: createCollaboratorArrear
      tags: [admin-finance]
      parameters:
        - in: path
          name: collaboratorId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArrearInput" }
      responses:
        "201":
          description: Arrear created and the recipient granted own-finance visibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrearResult" }
        "400": { description: Invalid arrear or recipient }
        "403": { description: Confidential finance data requires the ADMIN role }
  /admin/collaborators/{collaboratorId}/salary-records:
    get:
      operationId: listCollaboratorSalaryRecords
      tags: [admin-finance]
      parameters:
        - in: path
          name: collaboratorId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Confidential salary records for a collaborator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalaryRecordsList" }
        "400": { description: Invalid collaborator id }
        "403": { description: Confidential finance data requires the ADMIN role }
        "404": { description: Collaborator not found }
    post:
      operationId: assignCollaboratorSalaryRecord
      tags: [admin-finance]
      parameters:
        - in: path
          name: collaboratorId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalaryRecordInput" }
      responses:
        "201":
          description: Salary record assigned and own-finance visibility granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalaryRecordResult" }
        "400": { description: Invalid record or non-collaborator recipient }
        "403": { description: Confidential finance data requires the ADMIN role }
        "409": { description: A record for this period already exists }
  /admin/salary-records/{id}:
    patch:
      operationId: updateSalaryRecord
      tags: [admin-finance]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalaryRecordUpdate" }
      responses:
        "200":
          description: Salary record updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalaryRecordResult" }
        "400": { description: Invalid update }
        "403": { description: Confidential finance data requires the ADMIN role }
        "404": { description: Salary record not found }
        "409": { description: Another salary record already uses this period }
  /workspace/me/financial-summary:
    get:
      operationId: getWorkspaceFinancialSummary
      tags: [workspace-finance]
      summary: Get the current collaborator's latest salary record
      responses:
        "200":
          description: Latest salary data visible to the authenticated collaborator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialSummaryResponse" }
        "401": { description: Authentication required }
        "403": { description: Own financial information permission required }
  /admin/arrears/{id}:
    patch:
      operationId: updateArrear
      tags: [admin-finance]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArrearUpdate" }
      responses:
        "200":
          description: Arrear updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrearResult" }
        "400": { description: Invalid update or forbidden state transition }
        "403": { description: Confidential finance data requires the ADMIN role }
        "404": { description: Arrear not found }
        "409": { description: Transfer request is not pending or was already reviewed }
    delete:
      operationId: deleteArrear
      tags: [admin-finance]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Arrear deleted; only possible before a transfer request exists }
        "400": { description: Invalid arrear id }
        "403": { description: Confidential finance data requires the ADMIN role }
        "404": { description: Arrear not found }
        "409": { description: Records with transfer requests cannot be deleted }
  /workspace/me/arrears/{id}/transfer-request:
    post:
      operationId: requestArrearTransfer
      tags: [workspace-finance]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Transfer request saved (no bank transfer or payment is initiated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrearResult" }
        "403": { description: Own arrears permission required }
        "200":
          description: Previously recorded request returned without duplication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrearResult" }
        "400": { description: Invalid arrear id }
        "404": { description: Arrear not found for this collaborator }
        "409": { description: This arrear is resolved }
  /workspace/me/salary-records/{id}/transfer-request:
    post:
      operationId: requestSalaryTransfer
      tags: [workspace-finance]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Request recorded without a banking operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalaryRecordResult" }
        "200":
          description: Previously recorded request returned without duplication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalaryRecordResult" }
        "403": { description: Own financial information permission required }
        "404": { description: Salary not found for this collaborator }
        "409": { description: Salary already paid }
  /workspace/me/arrears/{id}/conditions-report:
    post:
      operationId: reportArrearConditions
      tags: [workspace-finance]
      description: Explicitly report that the administrator's conditions have been met; this does not approve verification or initiate payment.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Report recorded and administration and collaborator notified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrearResult" }
        "200":
          description: Existing report returned without duplicate notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrearResult" }
        "400": { description: Invalid arrear id }
        "401": { description: Authentication required }
        "403": { description: Own arrears permission required }
        "404": { description: Arrear not found for this collaborator }
        "409": { description: Arrear resolved or instructions not provided }
  /workspace/me/salary-records/{id}/conditions-report:
    post:
      operationId: reportSalaryConditions
      tags: [workspace-finance]
      description: Explicit condition-completion report, separate from legacy transfer requests; no banking operation.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Report recorded and administration and collaborator notified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalaryRecordResult" }
        "200":
          description: Existing report returned without duplicate notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalaryRecordResult" }
        "400": { description: Invalid salary record id }
        "401": { description: Authentication required }
        "403": { description: Own financial information permission required }
        "404": { description: Salary record not found for this collaborator }
        "409": { description: Salary already paid or instructions not provided }
  /admin/sender-services:
    get:
      operationId: listSenderServices
      tags: [admin]
      responses:
        "200":
          description: Configured sender identities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SenderServicesList" }
    post:
      operationId: createSenderService
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SenderServiceInput" }
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SenderServiceResult" }
        "409": { description: Name already used }
  /admin/sender-services/{id}:
    patch:
      operationId: updateSenderService
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SenderServiceUpdate" }
      responses:
        "200":
          description: Service updated, historical message identities unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SenderServiceResult" }
        "404": { description: Service not found }
        "409": { description: Name already used }
components:
  schemas:
    WorkspaceTask:
      type: object
      required: [id, title, description, status, priority, assigneeId]
      properties:
        id: { type: integer }
        caseId: { type: ["integer", "null"] }
        caseTitle: { type: ["string", "null"] }
        title: { type: string }
        description: { type: string }
        comment: { type: ["string", "null"] }
        status: { type: string, enum: [todo, in_progress, blocked, completed] }
        priority: { type: string, enum: [low, normal, high, urgent] }
        dueAt: { type: ["string", "null"], format: date-time }
        assigneeId: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminTask:
      allOf:
        - $ref: "#/components/schemas/WorkspaceTask"
        - type: object
          required: [assigneeName]
          properties:
            assigneeName: { type: string }
            caseTitle: { type: ["string", "null"] }
    AdminTaskInput:
      type: object
      required: [title, assigneeId]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        assigneeId: { type: integer, minimum: 1 }
        caseId: { type: ["integer", "null"], minimum: 1 }
        description: { type: string, maxLength: 5000 }
        priority: { type: string, enum: [low, normal, high, urgent] }
        status: { type: string, enum: [todo, in_progress, blocked, completed] }
        dueAt: { type: ["string", "null"], format: date-time }
    AdminTaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        assigneeId: { type: integer, minimum: 1 }
        caseId: { type: ["integer", "null"], minimum: 1 }
        description: { type: string, maxLength: 5000 }
        priority: { type: string, enum: [low, normal, high, urgent] }
        status: { type: string, enum: [todo, in_progress, blocked, completed] }
        dueAt: { type: ["string", "null"], format: date-time }
        comment: { type: ["string", "null"], maxLength: 2000 }
    WorkspaceTaskUpdate:
      type: object
      properties:
        status: { type: string, enum: [todo, in_progress, blocked, completed] }
        comment: { type: ["string", "null"], maxLength: 2000 }
    WorkspaceTaskResult:
      type: object
      required: [task]
      properties:
        task: { $ref: "#/components/schemas/WorkspaceTask" }
    WorkspaceTaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceTask" }
    AdminTaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/AdminTask" }
    WorkspaceTaskDeletion:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    WorkspaceCaseDetails:
      type: object
      required: [case, tasks, documents]
      properties:
        case: { $ref: "#/components/schemas/WorkspaceCase" }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceTask" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceDocument" }
    WorkspaceCase:
      type: object
      required: [id, title, reference, summary, description, status, priority, progress, assigneeId]
      properties:
        id: { type: integer }
        title: { type: string }
        reference: { type: string }
        summary: { type: string }
        description: { type: string }
        instructions: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string }
        priority: { type: string }
        progress: { type: integer }
        dueDate: { type: ["string", "null"], format: date-time }
        assigneeId: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceDocument:
      type: object
      required: [id, title, category, confidentiality, uploadedById, assignmentId, downloadPath]
      properties:
        id: { type: integer }
        caseId: { type: ["integer", "null"] }
        title: { type: string }
        manualContent: { type: ["string", "null"] }
        fileName: { type: ["string", "null"] }
        contentType: { type: ["string", "null"] }
        assetId: { type: ["string", "null"], format: uuid }
        category: { type: string }
        confidentiality: { type: string }
        uploadedById: { type: integer }
        createdAt: { type: string, format: date-time }
        assignmentId: { type: ["integer", "null"] }
        downloadPath: { type: ["string", "null"] }
    CollaboratorLoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    CollaboratorProfile:
      type: object
      required: [id, email, fullName, role, permissions, mustChangePassword]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
        mustChangePassword: { type: boolean }
    CollaboratorLoginSuccess:
      type: object
      required: [profile]
      properties:
        profile: { $ref: "#/components/schemas/CollaboratorProfile" }
    CollaboratorLoginChallenge:
      type: object
      required: [requiresTwoFactor]
      properties:
        requiresTwoFactor: { type: boolean, const: true }
    TwoFactorStatus:
      type: object
      required: [enabled, available, recoveryCodesRemaining]
      properties:
        enabled: { type: boolean }
        available: { type: boolean }
        recoveryCodesRemaining: { type: integer, minimum: 0 }
    TwoFactorSetupInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
    TwoFactorSetup:
      type: object
      required: [secret, otpauthUrl, expiresAt]
      properties:
        secret: { type: string }
        otpauthUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    TwoFactorUnavailable:
      type: object
      required: [available]
      properties:
        available: { type: boolean, const: false }
    TwoFactorCodeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 32 }
    TwoFactorEnabled:
      type: object
      required: [enabled, recoveryCodes]
      properties:
        enabled: { type: boolean, const: true }
        recoveryCodes:
          type: array
          minItems: 8
          maxItems: 10
          items: { type: string }
    TwoFactorDisableInput:
      type: object
      additionalProperties: false
      required: [password, code]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
        code: { type: string, minLength: 6, maxLength: 32 }
    TwoFactorDisabled:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, const: false }
    TwoFactorRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 8
          maxItems: 10
          items: { type: string }
    WorkspaceSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            type: object
            required: [id, expiresAt, lastActiveAt, createdAt, browserName, osName, current, device]
            properties:
              id: { type: integer }
              expiresAt: { type: string, format: date-time }
              lastActiveAt: { type: string, format: date-time }
              createdAt: { type: string, format: date-time }
              browserName: { type: ["string", "null"] }
              osName: { type: ["string", "null"] }
              current: { type: boolean }
              device: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PrivateUploadRequest:
      type: object
      required: [fileName, contentType, size, kind]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, minLength: 1, maxLength: 255 }
        size:
          type: integer
          minimum: 1
          maximum: 52428800
          description: profile-photo uploads are additionally limited to 5242880 bytes
        kind:
          type: string
          enum: [document, audio, video, profile-photo]
          description: profile-photo accepts only image/jpeg, image/png, or image/webp; SVG is not accepted
    PrivateUploadUrl:
      type: object
      required: [assetId, uploadURL, method, headers]
      properties:
        assetId: { type: string, format: uuid }
        uploadURL: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          properties:
            Content-Type: { type: string }
    PrivateUpload:
      type: object
      required: [assetId, fileName, contentType, size]
      properties:
        assetId: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer }
    SetWorkspaceProfilePhotoInput:
      type: object
      additionalProperties: false
      required: [assetId]
      properties:
        assetId: { type: string, format: uuid }
    WorkspaceProfilePhoto:
      type: object
      required: [photo, removed, referencePortrait]
      properties:
        photo:
          anyOf:
            - $ref: "#/components/schemas/ProfilePhoto"
            - type: "null"
        removed: { type: boolean }
        referencePortrait:
          type: boolean
          description: Server-derived eligibility to display the configured reference portrait
    ProfilePhoto:
      type: object
      required: [url, contentType, expiresIn]
      properties:
        url: { type: string, format: uri }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        expiresIn: { type: integer, enum: [300] }
    PrivateFileUrl:
      type: object
      required: [url, fileName, contentType, expiresIn]
      properties:
        url: { type: string, format: uri }
        fileName: { type: string }
        contentType: { type: string }
        expiresIn: { type: integer, enum: [300] }
    Arrear:
      type: object
      required: [id, collaboratorId, periodLabel, amount, currency, status, communicatedReason, transferInstructions, transferRequestedAt, transferRequestStatus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        collaboratorId: { type: integer }
        periodLabel: { type: string }
        amount:
          type: ["string", "null"]
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
          description: Decimal amount is transported as a string to preserve precision; null means legacy amount unknown.
        currency: { type: ["string", "null"], pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [open, settled, archived] }
        communicatedReason: { type: ["string", "null"] }
        transferInstructions: { type: ["string", "null"] }
        payrollServiceName: { type: string }
        payrollServiceSignature: { type: string }
        transferRequestedAt: { type: ["string", "null"], format: date-time }
        transferRequestStatus: { type: ["string", "null"], enum: [pending, acknowledged, declined, null] }
        conditionsReportedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ArrearsList:
      type: object
      required: [arrears]
      properties:
        arrears:
          type: array
          items: { $ref: "#/components/schemas/Arrear" }
    ArrearResult:
      type: object
      required: [arrear]
      properties:
        arrear: { $ref: "#/components/schemas/Arrear" }
    ArrearInput:
      type: object
      additionalProperties: false
      required: [periodLabel, amount, currency, communicatedReason, transferInstructions]
      properties:
        periodLabel: { type: string, minLength: 1, maxLength: 120 }
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
          description: Decimal amount, sent as a string to avoid floating-point precision loss
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        communicatedReason: { type: string, minLength: 1, maxLength: 5000 }
        transferInstructions: { type: string, minLength: 1, maxLength: 5000 }
        payrollServiceName: { type: string, minLength: 1, maxLength: 120 }
        payrollServiceSignature: { type: string, maxLength: 500 }
        status: { type: string, enum: [open, settled, archived] }
    ArrearUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        periodLabel: { type: string, minLength: 1, maxLength: 120 }
        amount:
          type: ["string", "null"]
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
          description: Decimal string; null explicitly clears the amount to unknown
        currency: { type: ["string", "null"], pattern: "^[A-Z]{3}$" }
        communicatedReason: { type: ["string", "null"], maxLength: 5000 }
        transferInstructions: { type: ["string", "null"], maxLength: 5000 }
        payrollServiceName: { type: string, minLength: 1, maxLength: 120 }
        payrollServiceSignature: { type: string, maxLength: 500 }
        status: { type: string, enum: [open, settled, archived] }
        transferRequestStatus: { type: string, enum: [acknowledged, declined] }
    SalaryRecord:
      type: object
      required: [id, collaboratorId, salaryStatus, periodLabel, communicatedDelayReason, amount, currency, transferInstructions, payrollServiceName, payrollServiceSignature, transferRequestedAt, transferRequestStatus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        collaboratorId: { type: integer }
        salaryStatus:
          type: string
          description: Status as communicated by the administrator
        periodLabel: { type: string }
        communicatedDelayReason: { type: ["string", "null"] }
